[package]
name = "frameeyeosc"
version = "0.8.0"
edition = "2024"
license = "MIT"
description = "Sends Steam Frame eye tracking (gaze and eyelids) to VRChat over OSC"
repository = "https://github.com/MayoEDU/FOS"

[profile.release]
strip = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
memmap2 = "0.9"
rosc = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
